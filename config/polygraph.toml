introduction = """
## Code Complexity Analysis Report
Generated by `polygraph` (https://github.com/tcrichardson/polygraph). This report provides per-function and per-file complexity metrics to guide refactoring and code review decisions.
### Metric Reference
**Cyclomatic Complexity** counts decision points in a function (if, for, while, match arms, &&, ||, etc.), starting at 1.
- 1–5: Simple, low risk
- 6–10: Moderate, acceptable
- 11–20: Complex, consider breaking up
- >20: Very high, refactoring strongly recommended
**Nesting Depth** measures how deeply control-flow blocks are nested.
- 1–2: Normal
- 3: Borderline — review for early-return opportunities
- >3: High — likely benefits from extraction or guard clauses
**Halstead Volume** estimates the information content of a function (higher = more to hold in mind at once).
**Halstead Difficulty** estimates how error-prone a function is to write correctly.
**Halstead Effort** = Volume × Difficulty — the best single-number proxy for cognitive load.
- <500: Low effort, easy to reason about
- 500–2000: Moderate
- 2000–10000: High, consider simplification
- >10000: Very high, likely needs decomposition
**Halstead Time** is Effort / 18 — estimated seconds to implement from scratch; treat as a rough relative comparison, not a prediction.
### How to Use This Report
1. **Triage by complexity**: Sort functions by cyclomatic complexity descending. Functions >10 are candidates for decomposition.
2. **Cross-check with nesting**: A function with complexity 8 and nesting 4 is harder to understand than one with complexity 12 and nesting 2.
3. **Use Halstead effort for prioritisation**: When complexity alone is ambiguous, high effort scores confirm the function deserves attention.
4. **Duplicate clusters** list functions sharing a name and structural fingerprint across files. These are extraction candidates — move to a shared module.
5. **Per-file totals** help identify files that have accumulated too much responsibility; high total complexity + many functions may indicate a file that should be split.
"""
[project_summary]
# Scale context + one health signal per dimension.
# avg_complexity_per_function > 5 suggests systemic complexity; > 8 is a red flag.
# max_nesting_depth > 3 means at least one function anywhere needs attention.
# avg_halstead_effort > 1000 suggests the codebase is generally dense.
metrics = [
  "total_functions",
  "avg_complexity_per_function",
  "max_nesting_depth",
  "avg_halstead_effort",
]
[file_summary]
# max_* metrics tell the agent whether any function in this file breaches a threshold.
# avg_* metrics tell the agent whether the problem is isolated or widespread.
# Read a file's per-function table when: max_complexity > 10, max_nesting_depth > 3,
# or max_halstead_effort > 2000.
metrics = [
  "total_functions",
  "max_complexity",
  "avg_complexity_per_function",
  "max_nesting_depth",
  "max_halstead_effort",
  "avg_halstead_effort",
]